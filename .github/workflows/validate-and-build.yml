name: Validate and Build Marketplace

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Make Validation Script Executable
        run: chmod +x scripts/validate.sh

      - name: Run Marketplace Validation
        run: ./scripts/validate.sh --strict

      # No package-lock.json is committed, so `npm ci` is unavailable.
      - name: Install Dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      # The CLI exec test resolves the PDF plugin from ~/.toolforge/plugins.json.
      - name: Register PDF Plugin
        run: node src/cli/index.js plugins add toolforge-pdf

      - name: Lint
        run: npm run lint

      - name: Run Unit and API Tests
        run: npm test

      - name: Run UI Tests
        run: npm run ui:test

      - name: Build Static UI
        run: npm run ui:build
